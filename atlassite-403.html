<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>权限不足 - AtlasSite</title>
  <style>
    :root {
      --font-base: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.8125rem);
      --text-sm: clamp(0.875rem, 0.825rem + 0.25vw, 0.9375rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.0625rem);
      --text-lg: clamp(1.125rem, 1.05rem + 0.375vw, 1.25rem);
      --text-xl: clamp(1.25rem, 1.15rem + 0.5vw, 1.5rem);
      --text-2xl: clamp(1.5rem, 1.3rem + 1vw, 2rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-6: 1.5rem; --space-8: 2rem; --space-12: 3rem; --space-16: 4rem;
      --radius-sm: 4px; --radius-md: 8px; --radius-full: 999px;

      --bg-primary: #FFFFFF; --bg-secondary: #F5F5F5; --bg-tertiary: #EBEBEB; --bg-hover: #F9F9F9;
      --text-primary: #000000; --text-secondary: #525252; --text-tertiary: #737373; --text-inverse: #FFFFFF;
      --border-subtle: #E5E5E5; --border-default: #D4D4D4; --border-strong: #A3A3A3;
      --accent-primary: #0066FF;
      --state-warning: #EA580C;

      --shadow-sm: 0 2px 4px 0 rgba(0,0,0,0.06), 0 1px 2px 0 rgba(0,0,0,0.03);
      --focus-ring: 0 0 0 3px rgba(0,102,255,0.2);
      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #0A0A0A; --bg-secondary: #141414; --bg-tertiary: #1F1F1F; --bg-hover: #262626;
        --text-primary: #FAFAFA; --text-secondary: #A3A3A3; --text-tertiary: #737373; --text-inverse: #0A0A0A;
        --border-subtle: #262626; --border-default: #404040; --border-strong: #525252;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body { font-family: var(--font-base); font-size: var(--text-base); line-height: 1.75; color: var(--text-primary); background: var(--bg-primary); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    h1 { font-weight: 600; line-height: 1.3; letter-spacing: -0.02em; }

    .error-container {
      max-width: 560px;
      padding: var(--space-6);
      text-align: center;
    }

    .error-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto var(--space-6);
      color: var(--state-warning);
    }

    .error-code {
      font-size: var(--text-2xl);
      font-weight: 700;
      margin-bottom: var(--space-3);
      letter-spacing: -0.03em;
    }

    .error-title {
      font-size: var(--text-xl);
      font-weight: 600;
      margin-bottom: var(--space-4);
    }

    .error-message {
      color: var(--text-secondary);
      margin-bottom: var(--space-8);
      line-height: 1.6;
    }

    .error-actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      align-items: center;
    }

    .btn {
      padding: var(--space-3) var(--space-6);
      background: var(--text-primary);
      color: var(--text-inverse);
      border: none;
      border-radius: var(--radius-full);
      font-family: inherit;
      font-size: var(--text-base);
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all var(--transition-fast);
    }

    .btn:hover {
      opacity: 0.85;
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border-default);
    }

    .btn-secondary:hover {
      background: var(--bg-hover);
      border-color: var(--border-strong);
    }

    .error-help {
      margin-top: var(--space-8);
      padding-top: var(--space-6);
      border-top: 1px solid var(--border-subtle);
    }

    .error-help-title {
      font-size: var(--text-sm);
      font-weight: 600;
      margin-bottom: var(--space-3);
      color: var(--text-secondary);
    }

    .error-help-list {
      list-style: none;
      font-size: var(--text-sm);
      color: var(--text-tertiary);
      line-height: 2;
    }

    .error-help-list a {
      color: var(--accent-primary);
      text-decoration: none;
      transition: opacity var(--transition-fast);
    }

    .error-help-list a:hover {
      text-decoration: underline;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
        <circle cx="60" cy="60" r="45"/>
        <path d="M60 35 L60 65"/>
        <circle cx="60" cy="80" r="3" fill="currentColor" stroke="none"/>
      </g>
    </svg>

    <div class="error-code">403</div>
    <h1 class="error-title">权限不足</h1>
    <p class="error-message">
      抱歉，你没有权限访问此页面。这可能是因为内容设置为私密，或者需要特定的社群成员身份。
    </p>

    <div class="error-actions">
      <a href="/" class="btn">返回首页</a>
      <button onclick="window.history.back()" class="btn btn-secondary">返回上一页</button>
    </div>

    <div class="error-help">
      <div class="error-help-title">可能的原因</div>
      <ul class="error-help-list">
        <li>内容仅对社群成员可见</li>
        <li>作者已将内容设为私密</li>
        <li>你已被内容作者屏蔽</li>
        <li>社群管理员限制了访问</li>
      </ul>
    </div>
  </div>
</body>
</html>
