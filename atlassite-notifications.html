<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通知 - AtlasSite</title>
  <style>
    :root {
      --font-base: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.8125rem);
      --text-sm: clamp(0.875rem, 0.825rem + 0.25vw, 0.9375rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.0625rem);
      --text-lg: clamp(1.125rem, 1.05rem + 0.375vw, 1.25rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-6: 1.5rem; --space-8: 2rem; --space-12: 3rem;
      --content-width: 720px; --sidebar-width: 240px;
      --radius-sm: 4px; --radius-md: 8px; --radius-full: 999px;

      --bg-primary: #FFFFFF; --bg-secondary: #F5F5F5; --bg-tertiary: #EBEBEB; --bg-hover: #F9F9F9;
      --text-primary: #000000; --text-secondary: #525252; --text-tertiary: #737373; --text-inverse: #FFFFFF;
      --border-subtle: #E5E5E5; --border-default: #D4D4D4; --border-strong: #A3A3A3;
      --accent-primary: #0066FF;
      --accent-bg: #E6F0FF;

      --shadow-xs: 0 1px 2px 0 rgba(0,0,0,0.04);
      --shadow-sm: 0 2px 4px 0 rgba(0,0,0,0.06), 0 1px 2px 0 rgba(0,0,0,0.03);
      --shadow-md: 0 4px 8px 0 rgba(0,0,0,0.08), 0 2px 4px 0 rgba(0,0,0,0.04);
      --shadow-lg: 0 8px 16px 0 rgba(0,0,0,0.1), 0 4px 8px 0 rgba(0,0,0,0.06);

      --focus-ring: 0 0 0 3px rgba(0,102,255,0.2);

      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 350ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #0A0A0A; --bg-secondary: #141414; --bg-tertiary: #1F1F1F; --bg-hover: #262626;
        --text-primary: #FAFAFA; --text-secondary: #A3A3A3; --text-tertiary: #737373; --text-inverse: #0A0A0A;
        --border-subtle: #262626; --border-default: #404040; --border-strong: #525252;
        --accent-bg: #1A2433;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body { font-family: var(--font-base); font-size: var(--text-base); line-height: 1.75; color: var(--text-primary); background: var(--bg-primary); }
    h1 { font-size: var(--text-lg); font-weight: 600; line-height: 1.3; }
    a { color: var(--text-primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .layout { display: grid; grid-template-columns: var(--sidebar-width) 1fr; min-height: 100vh; }
    @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }

    .sidebar { position: sticky; top: 0; height: 100vh; padding: var(--space-6) var(--space-4); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: var(--space-8); background: var(--bg-primary); }
    @media (max-width: 768px) { .sidebar { position: fixed; bottom: 0; left: 0; right: 0; top: auto; height: auto; flex-direction: row; justify-content: space-around; padding: var(--space-3); border-right: none; border-top: 1px solid var(--border-subtle); z-index: 100; } }

    .logo { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-lg); font-weight: 700; }
    .logo svg { width: 32px; height: 32px; }
    @media (max-width: 768px) { .logo span { display: none; } }

    .nav { display: flex; flex-direction: column; gap: var(--space-1); }
    @media (max-width: 768px) { .nav { flex-direction: row; gap: 0; } }

    .nav-item { padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); color: var(--text-secondary); font-size: var(--text-sm); transition: all 0.15s; display: flex; align-items: center; gap: var(--space-2); }
    .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); text-decoration: none; }
    .nav-item.active { background: var(--bg-secondary); color: var(--text-primary); font-weight: 500; }
    @media (max-width: 768px) { .nav-item { flex-direction: column; gap: var(--space-1); padding: var(--space-2); font-size: var(--text-xs); } }

    .main { max-width: var(--content-width); margin: 0 auto; padding: var(--space-6) var(--space-4) calc(var(--space-12) + 60px); }
    @media (min-width: 769px) { .main { padding-bottom: var(--space-12); } }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6); }

    .filter-tabs {
      display: flex;
      gap: var(--space-2);
      margin-bottom: var(--space-6);
      padding: var(--space-2);
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      overflow-x: auto;
    }

    .filter-tab {
      padding: var(--space-2) var(--space-3);
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: var(--text-sm);
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition-fast);
    }

    .filter-tab.active {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-weight: 500;
      box-shadow: var(--shadow-xs);
    }

    .filter-tab:hover:not(.active) {
      color: var(--text-primary);
      background: var(--bg-hover);
    }

    .notification-list {
      display: flex;
      flex-direction: column;
    }

    .notification-item {
      padding: var(--space-4);
      border-bottom: 1px solid var(--border-subtle);
      transition: all var(--transition-fast);
      cursor: pointer;
    }

    .notification-item:hover {
      background: var(--bg-hover);
      transform: translateX(4px);
    }

    .notification-item.unread {
      background: var(--accent-bg);
    }

    .notification-item:last-child {
      border-bottom: none;
    }

    .notification-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: var(--space-2);
      gap: var(--space-3);
    }

    .notification-type {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      padding: var(--space-1) var(--space-2);
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      font-size: var(--text-xs);
      color: var(--text-secondary);
    }

    .notification-time {
      font-size: var(--text-sm);
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    .notification-content {
      margin-bottom: var(--space-2);
      line-height: 1.6;
    }

    .notification-actor {
      font-weight: 500;
      color: var(--text-primary);
    }

    .notification-target {
      color: var(--text-secondary);
    }

    .notification-actions {
      display: flex;
      gap: var(--space-3);
      font-size: var(--text-sm);
    }

    .notification-link {
      color: var(--accent-primary);
    }

    .notification-link:hover {
      text-decoration: underline;
    }

    .btn {
      padding: var(--space-2) var(--space-4);
      background: var(--text-primary);
      color: var(--text-inverse);
      border: none;
      border-radius: var(--radius-full);
      font-family: inherit;
      font-size: var(--text-sm);
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .btn:hover {
      opacity: 0.85;
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-default);
    }

    .btn-secondary:hover {
      background: var(--bg-tertiary);
      border-color: var(--border-strong);
    }

    .empty-state {
      padding: var(--space-12) var(--space-4);
      text-align: center;
      color: var(--text-tertiary);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: var(--space-4);
    }

    .unread-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 var(--space-2);
      background: var(--accent-primary);
      color: white;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: 600;
    }
  </style>
</head>
<body>

              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

  <script>
    // Filter tabs
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');

        const filter = this.dataset.filter;
        // In production, this would filter notifications by type
        console.log('Filter:', filter);
      });
    });

    // Mark as read
    document.querySelectorAll('.notification-item.unread').forEach(item => {
      const markButton = item.querySelector('button');
      if (markButton && markButton.textContent.includes('标为已读')) {
        markButton.addEventListener('click', function(e) {
          e.preventDefault();
          item.classList.remove('unread');
          this.remove();
        });
      }
    });
  </script>
